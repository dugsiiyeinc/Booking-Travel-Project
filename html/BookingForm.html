<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookForm</title>
    <link rel="stylesheet" href="/css/BookingForm.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="container">
          <div class="back-home">
    <a href="javascript:history.back()">← Back Home 🏠</a>

  </div>
        <div class="header">
            <h1><i class="fas fa-plane"></i> Travel Booking Payment</h1>
            <p>Complete your travel booking with secure payment methods</p>
        </div>
        
        <div class="main-content">
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-user"></i> Personal Information
                </div>
                <div class="row">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name">
                    </div>
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name">
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                
                <div class="section-title">
                    <i class="fas fa-map-marked-alt"></i> Travel Details
                </div>
                <div class="input-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" placeholder="Where are you traveling to?">
                </div>
                <div class="row">
                    <div class="input-group">
                        <label for="departure">Departure Date</label>
                        <input type="date" id="departure">
                    </div>
                    <div class="input-group">
                        <label for="return">Return Date</label>
                        <input type="date" id="return">
                    </div>
                </div>
                <div class="input-group">
                    <label for="travelers">Number of Travelers</label>
                    <select id="travelers">
                        <option value="1">1 Traveler</option>
                        <option value="2">2 Travelers</option>
                        <option value="3">3 Travelers</option>
                        <option value="4">4 Travelers</option>
                        <option value="5">5+ Travelers</option>
                    </select>
                </div>
                
                <div class="section-title">
                    <i class="fas fa-credit-card"></i> Payment Method
                </div>
                <div class="payment-methods">
                    <div class="payment-method" data-method="sahal">
                        <i class="fas fa-mobile-alt"></i>
                        <div>Sahal</div>
                    </div>
                    <div class="payment-method" data-method="zaad">
                        <i class="fas fa-sim-card"></i>
                        <div>Zaad</div>
                    </div>
                    <div class="payment-method" data-method="evc">
                        <i class="fas fa-phone-alt"></i>
                        <div>EVC</div>
                    </div>
                    <div class="payment-method" data-method="edahab">
                        <i class="fas fa-landmark"></i>
                        <div>E-dahab</div>
                    </div>
                    <div class="payment-method" data-method="credit">
                        <i class="fas fa-credit-card"></i>
                        <div>Credit Card</div>
                    </div>
                </div>
                
                <div id="sahal-details" class="payment-details">
                    <div class="input-group">
                        <label for="sahalNumber">Sahal Number</label>
                        <input type="text" id="sahalNumber" placeholder="Enter your Sahal number">
                    </div>
                </div>
                
                <div id="zaad-details" class="payment-details">
                    <div class="input-group">
                        <label for="zaadNumber">Zaad Number</label>
                        <input type="text" id="zaadNumber" placeholder="Enter your Zaad number">
                    </div>
                </div>
                
                <div id="evc-details" class="payment-details">
                    <div class="input-group">
                        <label for="evcNumber">EVC Number</label>
                        <input type="text" id="evcNumber" placeholder="Enter your EVC number">
                    </div>
                </div>
                
                <div id="edahab-details" class="payment-details">
                    <div class="input-group">
                        <label for="edahabNumber">E-dahab Number</label>
                        <input type="text" id="edahabNumber" placeholder="Enter your E-dahab number">
                    </div>
                </div>
                
                <div id="credit-details" class="payment-details">
                    <div class="input-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" placeholder="Enter card number">
                    </div>
                    <div class="row">
                        <div class="input-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>
                        <div class="input-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="CVV">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="cardName">Cardholder Name</label>
                        <input type="text" id="cardName" placeholder="Enter cardholder name">
                    </div>
                </div>
                
                <button class="btn" id="payNow">
                    <i class="fas fa-lock"></i> Pay Now
                </button>
                
                <div class="save-data">
                    <input type="checkbox" id="saveInfo">
                    <label for="saveInfo">Save my information for future purchases</label>
                </div>
            </div>
            
            <div class="bookings-section">
                <div class="section-title">
                    <i class="fas fa-history"></i> Saved Bookings
                </div>
                <div id="bookingsList">
                    <!-- Bookings will be displayed here -->
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        Payment information saved successfully!
    </div>

 <script src="../js/BookingForm.js"></script>
</body>
</html>
